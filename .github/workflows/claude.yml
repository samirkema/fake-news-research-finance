name: Claude

# Claude Code depuis GitHub, ordinateur éteint : écrire « @claude ... » dans une
# issue ou une PR. Seuls les comptes ayant les droits d'écriture sur le dépôt
# peuvent le déclencher (contrôle par défaut de l'action). Claude travaille sur
# une branche et propose une PR : rien n'arrive sur main sans ta validation.
"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    # Volontairement AUCUN secret de production (DATABASE_URL...) : le texte d'une
    # issue est une entrée non fiable, Claude ne doit pas pouvoir toucher la base.
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pour que Claude puisse lancer les tests (pytest) avant de proposer sa PR.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Épinglé sur un commit (v1.0.237), comme le modèle spaCy du pipeline.
      - uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
